services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familypledge}
      POSTGRES_USER: ${POSTGRES_USER:-familypledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/ovh/.env}
    volumes:
      - familypledge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familypledge} -d ${POSTGRES_DB:-familypledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familypledge

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/ovh/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/ovh/.env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/ovh/.env}
      SQL_ECHO: ${SQL_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-false}
      DEMO_SEED_ON_STARTUP: ${DEMO_SEED_ON_STARTUP:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

      # Safaricom Daraja / M-PESA (backend only)
      MPESA_ENABLED: ${MPESA_ENABLED:-false}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_BASE_URL: ${MPESA_BASE_URL:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://api.familypledgekenya.org/api/v1/payments/mpesa/callback}
      MPESA_ACCOUNT_REFERENCE: ${MPESA_ACCOUNT_REFERENCE:-133133}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      MPESA_TRANSACTION_DESC: ${MPESA_TRANSACTION_DESC:-Family Pledge}
      MPESA_REQUEST_TIMEOUT_SECONDS: ${MPESA_REQUEST_TIMEOUT_SECONDS:-20}
      MPESA_PAYMENT_TTL_MINUTES: ${MPESA_PAYMENT_TTL_MINUTES:-10}
      MPESA_USD_KES_RATE: ${MPESA_USD_KES_RATE:-0}
      MPESA_RECONCILIATION_ENABLED: ${MPESA_RECONCILIATION_ENABLED:-false}
      MPESA_RECONCILIATION_INTERVAL_SECONDS: ${MPESA_RECONCILIATION_INTERVAL_SECONDS:-60}
      MPESA_RECONCILIATION_BATCH_SIZE: ${MPESA_RECONCILIATION_BATCH_SIZE:-50}
      MPESA_QUERY_AFTER_SECONDS: ${MPESA_QUERY_AFTER_SECONDS:-30}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-oss-120b}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_VISION_MAX_IMAGE_MB: ${AI_VISION_MAX_IMAGE_MB:-5}
      AI_TASKS_WORKER_ENABLED: ${AI_TASKS_WORKER_ENABLED:-true}
      AI_TASKS_WORKER_INTERVAL_SECONDS: ${AI_TASKS_WORKER_INTERVAL_SECONDS:-60}
      OUTBOUND_WORKER_ENABLED: ${OUTBOUND_WORKER_ENABLED:-true}
      OUTBOUND_WORKER_INTERVAL_SECONDS: ${OUTBOUND_WORKER_INTERVAL_SECONDS:-30}
      OUTBOUND_WORKER_BATCH_SIZE: ${OUTBOUND_WORKER_BATCH_SIZE:-250}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}
      WEB_APP_BASE_URL: ${WEB_APP_BASE_URL:-https://familypledgekenya.org}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.familypledgekenya.org/api/v1}
      WEEKLY_EMAILS_ENABLED: ${WEEKLY_EMAILS_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-family_pledge_reminder}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://media.familypledgekenya.org}
      R2_MAX_UPLOAD_MB: ${R2_MAX_UPLOAD_MB:-500}
      R2_ALLOWED_UPLOADS_MODE: ${R2_ALLOWED_UPLOADS_MODE:-broad}
      PROOF_R2_ACCOUNT_ID: ${PROOF_R2_ACCOUNT_ID:-}
      PROOF_R2_ACCESS_KEY_ID: ${PROOF_R2_ACCESS_KEY_ID:-}
      PROOF_R2_SECRET_ACCESS_KEY: ${PROOF_R2_SECRET_ACCESS_KEY:-}
      PROOF_R2_BUCKET_NAME: ${PROOF_R2_BUCKET_NAME:-}
      PROOF_RETENTION_DAYS: ${PROOF_RETENTION_DAYS:-30}
      PROOF_SIGNED_GET_TTL_SECONDS: ${PROOF_SIGNED_GET_TTL_SECONDS:-600}
      STREAM_API_TOKEN: ${STREAM_API_TOKEN:-}
      STREAM_CUSTOMER_CODE: ${STREAM_CUSTOMER_CODE:-}
      STREAM_MAX_DURATION_SECONDS: ${STREAM_MAX_DURATION_SECONDS:-21600}
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - familypledge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.familypledgekenya.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - familypledge

volumes:
  familypledge_postgres_data:
  caddy_data:
  caddy_config:

networks:
  familypledge:
    driver: bridge
