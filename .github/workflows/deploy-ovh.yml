name: Deploy OVH Production

on:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-pledge-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve successfully tested main SHA
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested main to OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${OVH_USER}@${OVH_HOST}" \
            "set -euo pipefail; \
             cd ~/Family_Pledge_Gaza_Project; \
             git fetch --prune origin main; \
             git show origin/main:deploy/ovh/scripts/deploy_from_main.sh > /tmp/family-pledge-deploy.sh; \
             chmod 700 /tmp/family-pledge-deploy.sh; \
             FAMILY_PLEDGE_EXPECTED_SHA='${EXPECTED_SHA}' bash /tmp/family-pledge-deploy.sh; \
             rm -f /tmp/family-pledge-deploy.sh"
