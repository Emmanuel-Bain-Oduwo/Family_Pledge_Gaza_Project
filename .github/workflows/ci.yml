name: Production CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: familypledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile check
        run: |
          cd backend
          python -m compileall app scripts tests
      - name: Worker import smoke check
        run: |
          cd backend
          python -c "import scripts.operations_worker; import scripts.ai_task_worker"
      - name: Alembic upgrade check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familypledge
        run: |
          cd backend
          alembic upgrade head
      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familypledge
        run: |
          cd backend
          pytest -q

  admin-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: frontend/admin/package-lock.json
      - name: Install admin dependencies
        run: |
          cd frontend/admin
          npm ci
      - name: Typecheck admin
        run: |
          cd frontend/admin
          npx tsc --noEmit
      - name: Build admin
        run: |
          cd frontend/admin
          npm run build

  mobile-checks:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://api.familypledgekenya.org/api/v1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install and reconcile SDK 55 dependencies
        run: |
          cd frontend/mobile
          npm install --no-audit --no-fund
          npx expo install --fix
      - name: Commit refreshed Expo dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'payments/pr10-legacy-cleanup'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/mobile/package.json frontend/mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Align Expo SDK 55 dependency lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify Expo dependency alignment
        run: |
          cd frontend/mobile
          npx expo install --check
      - name: Expo Doctor
        run: |
          cd frontend/mobile
          npx --yes expo-doctor@latest
      - name: Typecheck mobile
        run: |
          cd frontend/mobile
          npm run typecheck
      - name: Validate public Expo config
        run: |
          cd frontend/mobile
          npx expo config --type public >/tmp/family-pledge-expo-config.json
          test -s /tmp/family-pledge-expo-config.json
      - name: Build mobile web export
        run: |
          cd frontend/mobile
          npm run build:web
